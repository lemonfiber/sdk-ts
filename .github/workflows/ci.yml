# The gates every repo in the org shares, kept in one place so improving one
# improves all of them (Q-R56). Pinned by commit, bumped deliberately.
name: ci

on: [pull_request]

permissions:
  contents: read

jobs:
  spec-check:
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@d37cfa7e30b997f1e74a9713bed127cc05bf497e # main
  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@d37cfa7e30b997f1e74a9713bed127cc05bf497e # main
  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@d37cfa7e30b997f1e74a9713bed127cc05bf497e # main
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@d37cfa7e30b997f1e74a9713bed127cc05bf497e # main
  commitlint:
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@d37cfa7e30b997f1e74a9713bed127cc05bf497e # main
  labeler:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@d37cfa7e30b997f1e74a9713bed127cc05bf497e # main
