# The vendored contract is a copy, and a copy goes stale in silence.
#
# `contract:check` regenerates the types from the *vendored* artefact and diffs
# the result, so it proves this package agrees with itself and says nothing about
# what it agrees with. It stayed green while the server's contract moved nineteen
# kinds ahead, and would have stayed green indefinitely.
#
# Nothing else was looking. There is no dependency on lemonfiber to bump, and
# nothing on the wire changes: `api_version` describes the shape of the envelope,
# not the set of kinds inside it. So a client generated from a stale artefact
# parses every reply it still understands and simply has no type for the rest.
#
# This ran on a calendar and reported, and reporting was the half that did not
# work. It went red, correctly, and stayed red for days with nobody acting on it,
# because in the Actions list an advisory red and a broken gate are the same red
# X and telling them apart meant opening this file. So it runs on pull requests,
# fails them, and `main` requires it (`Q-R68`).
#
# The pin is meant to lag, and gating it does refuse pull requests that have
# nothing to do with the contract. That is the trade, taken deliberately: the
# stretch it refuses is the stretch this package would spend shipping against an
# artefact it has been told is wrong. What makes it payable is that a failure
# hands over the remedy rather than the diagnosis (`Q-R70`) — two commands, with
# the revision already filled in, printed where the author reads the failure.
name: contract-drift
on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Still weekly, now as the floor rather than the notice: a pull request is
    # what usually asks the question, and this catches a `main` that went a week
    # without one while the server moved.
    - cron: "20 7 * * 1"

permissions:
  contents: read

# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75). Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  contract-drift:
    name: contract-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Compare the vendored contract with the one the server describes
        env:
          LEMONFIBER: https://github.com/lemonfiber/lemonfiber.git
        run: |
          set -euo pipefail

          # The revision is resolved first and the contract fetched at it, so the
          # comparison and the command printed to fix it name the same commit.
          # Fetching `main` twice would let it move in between, and the remedy
          # would then be for a contract nobody compared.
          head=$(git ls-remote "$LEMONFIBER" refs/heads/main | cut -f1)

          # The sync script takes the contract at that revision into a scratch
          # tree, in whichever layout the server publishes there, and the compare
          # script names each file or kind that differs. Both read only Node's own
          # modules, so nothing is installed.
          node scripts/contract-sync.mjs "$head" --served
          status=0
          node scripts/contract-compare.mjs . .contract-served >"${RUNNER_TEMP}/differences" || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi

          HEAD_REVISION="$head" STATUS="$status" DIFFERENCES="${RUNNER_TEMP}/differences" python3 - <<'PY'
          import os
          import pathlib
          import sys

          # What the run page shows above the log. The verdict is written here as
          # well as printed, because a required check is read from the pull
          # request, where the log is one click further away than the summary.
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          said = []


          def say(line=""):
              print(line)
              said.append(line)


          def leave(code):
              if summary is not None:
                  pathlib.Path(summary).write_text("\n".join(said) + "\n")
              sys.exit(code)


          head = os.environ["HEAD_REVISION"]
          stamp = pathlib.Path("contract/VERSION").read_text().strip()
          differences = pathlib.Path(os.environ["DIFFERENCES"]).read_text().splitlines()

          if os.environ["STATUS"] == "0":
              say("## The vendored contract is current")
              say()
              say(f"It matches the one lemonfiber `{head}` describes, vendored at `{stamp}`.")
              leave(0)

          say("## The vendored contract is behind")
          say()
          say("**This check gates.** It fails every pull request against `main` until")
          say("the copy in `contract/` is the one lemonfiber serves. You did not")
          say("break this and you do not need to understand what differs below to fix it.")
          say()
          say(f"Vendored at `{stamp}`, compared with lemonfiber `{head}`:")
          say()
          for line in differences:
              say(f"- {line}")
          say()
          say("### Run this")
          say()
          say("```sh")
          say(f"npm run contract:sync -- {head}")
          say("npm run contract:generate")
          say("```")
          say()
          say("Then commit `contract/` and `src/generated`. Where that regenerates more")
          say("than types — a kind arriving is a change to this package's surface — land")
          say("the sync on its own first; that is the change this gate is asking for.")

          print(
              "::error::the vendored contract is behind lemonfiber "
              f"{head} — run `npm run contract:sync -- {head}` then "
              "`npm run contract:generate`, and commit contract/ and src/generated"
          )
          leave(1)
          PY
