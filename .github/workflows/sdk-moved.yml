# Tell the console when the client it pins has moved.
#
# `lemonfiber-web` reaches lemonfiber through this package and through nothing
# else, and it takes it as an exact git revision rather than as a published
# version. So a fix here is not a fix there until someone moves that revision,
# and nothing there was watching: its `sdk-drift` check compares the pin against
# this repository's main, but on a weekly schedule.
#
# The gap is cadence, not correctness. Driven by hand against a real pin, that
# check refused it and named the commits it was missing. This fires it on the
# change instead of on the calendar.
#
# Every commit on main counts. What the console gets is generated types, a
# transport, an event reader and a vendored contract, and there is no subset of
# this repository that leaves all four alone — so this is not filtered by path.
name: sdk-moved

on:
  push:
    branches: [main]
  # Kept so the notifier can be driven against a real change rather than trusted.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tell:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mint a token that can reach the console
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: lemonfiber-web

      - name: Ask the console to compare its pin against this main
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          if ! gh api --method POST \
            "repos/${OWNER}/lemonfiber-web/actions/workflows/sdk-drift.yml/dispatches" \
            -f ref=main
          then
            # A notifier that cannot notify has to say so. Reporting success
            # here would leave the weekly run as the only thing looking, which
            # is the state this workflow exists to end.
            echo "::error::the client moved and the console was not told"
            exit 1
          fi

          echo "asked lemonfiber-web to compare its pin against this main."
