# Read by SonarCloud Automatic Analysis, which is how this repository is scanned:
# `sonar.yml` runs the shared gate and no scan step of its own, so there is no
# `sonar-project.properties` for a scanner to read. That file is the one to add
# alongside a `sonarqube-scan-action` step, the way `lemonfiber` does it.
# Automatic Analysis takes the project key and organisation from the repository
# binding, so neither is set here.
#
# The suite `vitest.config.ts` names lives beside the code it covers, as
# `*.test.ts` under `src/` and `*.test.mjs` under `scripts/`. Unnamed here,
# Automatic Analysis reads those files as production source and applies the
# rules Sonar scopes to main code: cases differing only in their input read as a
# duplication wanting a parameter, and fixture data reads as a literal wanting a
# constant. Naming them leaves those rules pointed at the shipped surface, which
# is the split `eslint.config.js` already makes for the same files.
#
# The two sets have to be disjoint — a file claimed as both source and test is
# indexed twice and the analysis produces nothing — so the test patterns are
# named here and excluded from the sources they would otherwise fall under.
sonar.sources=.
sonar.tests=src,scripts
sonar.test.inclusions=**/*.test.ts,**/*.test.mjs

# `**/*.test.ts` and `**/*.test.mjs` are the exclusions that keep the two sets
# apart. `src/generated/**` is produced from the vendored contract artefact by
# `npm run contract:generate` and rewritten whole on every run, so a finding
# there cannot be fixed where it is reported: `contract:check` regenerates the
# directory and fails on any difference, so a hand edit is undone by the next
# run. ESLint, Prettier and knip skip it for the same reason.
sonar.exclusions=src/generated/**,dist/**,coverage/**,node_modules/**,**/*.test.ts,**/*.test.mjs
