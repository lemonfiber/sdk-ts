# Read by SonarCloud Automatic Analysis, which is how this repository is scanned:
# `sonar.yml` runs the shared gate and no scan step of its own, so there is no
# `sonar-project.properties` for a scanner to read. That file is the one to add
# alongside a `sonarqube-scan-action` step, the way `lemonfiber` does it.
#
# Generated from the contract artefact and rewritten whole on every sync, so its
# shape is the artefact's rather than anyone's to correct. A finding there cannot
# be fixed where it is reported: `contract:check` regenerates the file and fails
# on any difference, so a hand edit is undone by the next run.
sonar.exclusions=src/generated/**,dist/**,coverage/**,node_modules/**
