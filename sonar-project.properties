sonar.projectKey=lemonfiber_sdk-ts
sonar.organization=lemonfiber
sonar.sources=src,scripts
sonar.tests=src
sonar.test.inclusions=**/*.test.ts

# Generated from the contract artefact and rewritten whole on every sync, so its
# shape is the artefact's rather than anyone's to correct. A style finding here
# cannot be fixed where it is reported: `contract:check` regenerates the file and
# fails on any difference, so a hand edit is reverted by the next run.
sonar.exclusions=src/generated/**,dist/**,coverage/**,node_modules/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
