[default]
# Ignore hotkey mockup notation like [e]rror, [s]ervice in TUI examples.
# A commit hash is hexadecimal, and its letters are not words: `8fa05ba718f7`
# read as prose has `ba` in it.
extend-ignore-re = ["\\[[a-z]\\][a-zA-Z]+", "\\b[0-9a-f]*[0-9][0-9a-f]*\\b"]

[default.extend-words]
ratatui = "ratatui"
Ratatui = "Ratatui"
lemonfiber = "lemonfiber"
Servarr = "Servarr"
